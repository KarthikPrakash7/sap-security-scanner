- id: BTP-MTA-001
  severity: HIGH
  file_pattern: "mta.yaml"
  check: yaml_module_missing_require
  require_type: "org.cloudfoundry.managed-service"
  service_name_pattern: "xsuaa"
  message: "mta.yaml contains CF modules without requiring an XSUAA service"
  remediation:
    explanation: "Modules without an XSUAA dependency have no authentication enforced at the platform level. HTTP routes will be publicly accessible."
    fix_template: |
      Add to each module that serves HTTP traffic:
        requires:
          - name: <your-xsuaa-resource-name>
      And define the XSUAA resource:
        resources:
          - name: <your-xsuaa-resource-name>
            type: org.cloudfoundry.managed-service
            parameters:
              service: xsuaa
              service-plan: application
    effort: high
    docs_url: "https://help.sap.com/docs/btp/sap-business-technology-platform/mta"

- id: BTP-MTA-002
  severity: HIGH
  file_pattern: "mta.yaml"
  check: yaml_env_credentials
  key_patterns:
    - "(?i)(password|secret|clientsecret|apikey|api_key|token|credential)"
  skip_value_patterns:
    - "^~\\{"
    - "^\\$\\{"
    - "^\\(\\("
  message: "mta.yaml contains a hardcoded credential in module env vars"
  remediation:
    explanation: "Hardcoded credentials in mta.yaml are stored in source control and visible to anyone with repo access. Use MTA variable references to pull secrets from service bindings or credential stores."
    fix_template: |
      Replace:
        properties:
          CLIENT_SECRET: actual-secret-value
      With MTA variable reference:
        properties:
          CLIENT_SECRET: ~{xsuaa-binding/credentials/clientsecret}
      And add the service binding to requires.
    effort: medium
    docs_url: "https://help.sap.com/docs/btp/sap-business-technology-platform/mta"
