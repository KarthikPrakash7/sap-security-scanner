[project]
name = "btp-security-scanner"
version = "0.1.0"
description = "Security vulnerability scanner for SAP BTP app packages"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.1",
    "jsonpath-ng>=1.6.1",
    "fastmcp>=2.0.0",
    "anthropic>=0.40.0",
]

[project.scripts]
btp-sec-scan = "btp_sec_scan.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Trivy and Gitleaks installed",
]

[tool.hatch.build.targets.wheel]
packages = ["btp_sec_scan"]
include = ["btp_sec_scan/rules/**/*.yaml"]
