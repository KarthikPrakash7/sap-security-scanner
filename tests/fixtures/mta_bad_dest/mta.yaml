_schema-version: "3.1"
ID: bad-dest-app
version: 0.0.1

modules:
  - name: backend
    type: nodejs
    path: backend
    requires:
      - name: my-destination

resources:
  - name: my-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        init_data:
          instance:
            destinations:
              - Name: insecure-backend
                URL: http://legacy.internal/api
                Authentication: NoAuthentication
